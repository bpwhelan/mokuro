version: '3.8'

services:
  mokuro-server:
    image: ghcr.io/xrishox/mokuro-server:latest
    container_name: mokuro-server
    ports:
      - "7331:7331"
    environment:
      # Server configuration
      - MOKURO_HOST=0.0.0.0
      - MOKURO_PORT=7331
      - MOKURO_DEBUG=false
      - MOKURO_LOG_LEVEL=INFO
      - MOKURO_MAX_WORKERS=4
      - MOKURO_PRELOAD_MODELS=true
      
      # Python environment
      - PYTHONUNBUFFERED=1
      
      # Torch configuration (optimize for CPU if no GPU)
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      
      # Chrome configuration for lens OCR
      - CHROME_BIN=/usr/bin/google-chrome
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      
    volumes:
      # Model cache - persist downloaded models
      - mokuro-models:/root/.cache
      
      # Application cache
      - ./cache:/app/cache
      
      # Temporary files
      - mokuro-temp:/tmp/mokuro_api
      
      # Optional: mount local directory for batch processing
      # - ./input:/app/input:ro
      # - ./output:/app/output
      
    restart: unless-stopped
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7331/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mokuro-models:
    driver: local
  mokuro-temp:
    driver: local