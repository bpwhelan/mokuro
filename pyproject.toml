[project]
name = "mokuro"
authors = [
    {name = "Maciej Budyś", email = "kha-white@mail.com"},
]
description = "Browser reader for manga with selectable text"
readme = "README.md"
requires-python = ">=3.6"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
]

dynamic = ["version"]
dependencies = [
    "fire",
    "loguru",
    "manga-ocr>=0.1.7",
    "natsort",
    "numpy",
    "opencv-python>=4.1.2",
    "Pillow>=7.1.2",
    "pyclipper",
    "requests",
    "scipy",
    "setuptools",
    "shapely",
    "torch>=1.7.0",
    "torchsummary",
    "torchvision>=0.8.1",
    "transformers>=4.25.0",
    "tqdm>=4.41.0",
    "yattag",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
owocr = [
    # Base owocr package (includes OS-marked deps like pyobjc on macOS)
    "owocr>=1.14.7",
    # Enable all provider engines via owocr extras
    "owocr[mangaocr]>=1.14.7",
    "owocr[easyocr]>=1.14.7",
    "owocr[rapidocr]>=1.14.7",
    "owocr[lens]>=1.14.7",
    "owocr[lensweb]>=1.14.7",
    "owocr[gvision]>=1.14.7",
    "owocr[azure]>=1.14.7",
    # Windows-specific engines
    "owocr[winocr]>=1.14.7; platform_system == 'Windows'",
    "oneocr>=1.0.9; platform_system == 'Windows'",
]

[project.urls]
Homepage = "https://github.com/kha-white/mokuro"

[build-system]
requires = ["setuptools >= 61.0.0", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mokuro*", "comic_text_detector*"]

[tool.setuptools.package-data]
comic_text_detector = ["LICENSE"]

[tool.setuptools.dynamic]
version = {attr = "mokuro._version.__version__"}

[tool.ruff]
line-length = 120
indent-width = 4
extend-exclude = ["comic_text_detector", "notebooks"]

[project.scripts]
mokuro = "mokuro.__main__:main"
